name: Investigar VIS DATA 3
on:
  push:
    branches: [main]
    paths:
      - scripts/investigar_vis_data3.py
      - .github/workflows/investigar-vis3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/investigar_vis_data3.py
