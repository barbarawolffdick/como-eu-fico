name: Testes do MVP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do app
        run: python -m pip install -r requirements.txt
      - name: Verificar importação da aplicação
        run: python -c "from app.server import app; assert app.title == 'Como Eu Fico'"
      - name: Testar ingestao CGU, correspondencia IBGE e exportacao
        run: |
          python -m unittest discover -s tests -p 'test_ingerir_bolsa_familia.py' -v
          python -m unittest discover -s tests -p 'test_municipio_novo_bolsa.py' -v
          python -m unittest discover -s tests -p 'test_banco_app.py' -v
          python -m unittest discover -s tests -p 'test_integrar_fontes.py' -v
          python -m unittest discover -s tests -p 'test_integrar_ibge_populacao.py' -v
          python -m unittest discover -s tests -p 'test_server.py' -v
          python -m unittest discover -s tests -p 'test_correspondencia_pessoas_mds.py' -v

  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências web
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run lint
      - name: Compilar Next.js
        run: npm run build
      - name: Testar rotas Next.js com dados reais publicados
        run: |
          npm run start -- --port 3000 > /tmp/como-eu-fico-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/municipios?q=3550308 > /tmp/busca.json; then break; fi
            sleep 1
          done
          python -c "import json; r=json.load(open('/tmp/busca.json')); assert any(x['codigo_ibge']=='3550308' for x in r),r"
          curl -fsS http://127.0.0.1:3000/api/municipios/3550308 > /tmp/detalhe.json
          python -c "import json; r=json.load(open('/tmp/detalhe.json')); assert r['municipio']['codigo_ibge']=='3550308'; assert r['votos_presidenciais']; assert r['bolsa_familia']"
          curl -fsS 'http://127.0.0.1:3000/api/rankings?metrica=valor_total' > /tmp/rankings.json
          python -c "import json; r=json.load(open('/tmp/rankings.json')); assert r['disponivel'] and len(r['resultados'])==10,r"
          curl -fsS 'http://127.0.0.1:3000/api/mudanca-parcelas' > /tmp/mudanca.json
          python -c "import json; r=json.load(open('/tmp/mudanca.json')); assert r['municipios']>0 and r['inicio']<r['fim']; assert sum(x['total'] for x in r['porVencedor'])==r['municipios']; assert sum(x['total'] for x in r['porMudanca'])==r['municipios']"
          curl -fsS 'http://127.0.0.1:3000/api/mudanca-familias' > /tmp/familias.json
          python -c "import json; r=json.load(open('/tmp/familias.json')); assert 0<r['municipios']<=5571,r; assert sum(x['total'] for x in r['porVencedor'])==r['municipios']; assert sum(x['total'] for x in r['porMudanca'])==r['municipios']"
          curl -fsS 'http://127.0.0.1:3000/api/analises' > /tmp/analises.json
          python -c "import json; r=json.load(open('/tmp/analises.json')); assert r['universo']>0; assert len(r['distribuicao'])==3; assert len(r['evolucao'])==8; assert 'outros' in r"
          python tests/test_cobertura_http.py

