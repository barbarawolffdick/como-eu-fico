name: Testes do MVP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do app
        run: python -m pip install -r requirements.txt
      - name: Verificar importação da aplicação
        run: python -c "from app.server import app; assert app.title == 'Como Eu Fico'"
      - name: Testar ingestao CGU, correspondencia IBGE e exportacao
        run: |
          python -m unittest discover -s tests -p 'test_ingerir_bolsa_familia.py' -v
          python -m unittest discover -s tests -p 'test_municipio_novo_bolsa.py' -v
          python -m unittest discover -s tests -p 'test_banco_app.py' -v
          python -m unittest discover -s tests -p 'test_integrar_fontes.py' -v
          python -m unittest discover -s tests -p 'test_integrar_ibge_populacao.py' -v
