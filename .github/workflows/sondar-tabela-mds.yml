name: Investigar dados MDS sem geometria
on:
  push:
    branches: [main]
    paths:
      - scripts/sondar_tabela_mds_sem_geometria.py
      - .github/workflows/sondar-tabela-mds.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sondar_tabela_mds_sem_geometria.py
